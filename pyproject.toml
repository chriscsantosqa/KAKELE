[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kakelebot-next"
version = "0.1.0"
description = "Next-generation bootstrap for the Kakele desktop automation project"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Chris Santos" }
]
dependencies = [
  "pyautogui>=0.9.54",
  "PyGetWindow>=0.0.9",
  "pytesseract>=0.3.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[project.scripts]
kakelebot = "kakelebot.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
